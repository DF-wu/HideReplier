<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hide Replier</title>
    <link rel="stylesheet" href="index.css">
    <script src="index.js" defer></script>
</head>
<body>
    <div class="topPanel">
        <h1>匿名回覆機器人</h1>
        <div class="topLinks">
            <a href="https://hackmd.io/@dfder/ByADyqspI" target="_blank" rel="noreferrer">使用說明</a>
            <a href="https://github.com/DF-wu/HideReplier" target="_blank" rel="noreferrer">GitHub</a>
        </div>
        <div class="statusRow">
            <span>IP：<span id="ipDisplay">保護中</span></span>
            <span>國家：<span id="ipCountry">定位保護中</span></span>
            <span>城市：<span id="ipCity">定位保護中</span></span>
            <span>ISP：<span id="ipISP">定位保護中</span></span>
        </div>
    </div>

    <div class="mainPanel">
        <div class="inputForm">
            <label for="botNameInput">機器人名稱</label>
            <input type="text" id="botNameInput" value="預設機器人:)">

            <label for="colorInput">顏色（裝飾）</label>
            <input type="color" id="colorInput">

            <label for="selectThumbnail">小圖樣式</label>
            <select id="selectThumbnail">
                <option value="1">小圖：預設1</option>
                <option value="2">小圖：預設2</option>
                <option value="3">小圖：預設3</option>
                <option value="4">小圖：預設4</option>
                <option value="5">小圖：預設5</option>
                <option value="6">小圖：預設6</option>
                <option value="7">小圖：預設7</option>
            </select>

            <label for="avatarInput">頭像連結（可留空）</label>
            <input type="text" id="avatarInput" placeholder="https://example.com/avatar.png">

            <label for="imageInput">圖片連結（可留空）</label>
            <input type="text" id="imageInput" placeholder="https://example.com/image.png">

            <label for="contentText">內容文字</label>
            <textarea id="contentText" placeholder="輸入想匿名送出的訊息內容"></textarea>

            <div id="errorDisplay" aria-live="polite"></div>

            <div class="btnPanel">
                <button id="preview" type="button">預覽</button>
                <button id="submit" type="button" disabled>提交</button>
            </div>
        </div>

        <div class="previewDiv">
            <h3>預覽畫面</h3>
            <div class="preview">
                <div class="avatar">
                    <img src="https://cdn.discordapp.com/avatars/710112845567623238/f377b595ef4e0ea17826d7afbb20633f.webp?size=128" alt="預覽頭像">
                </div>
                <div class="innerPanel">
                    <div class="header">
                        <span id="botNameDisplay">預設機器人:)</span>
                        <div class="robotTag">機器人</div>
                    </div>
                    <div class="content">
                        <div class="contentTopPanel">
                            <div class="leftContent">
                                <div id="infoDisplay">匿名機器人（點我去發文）</div>
                                <div id="botNameWithColor">預設機器人:)</div>
                                <div id="contentDisplay">我是內容</div>
                                <table>
                                    <thead>
                                        <tr>
                                            <th>流水號</th>
                                            <th>來自：</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr>
                                            <td>待生成</td>
                                            <td id="ipDisplayInContent">保護中</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                            <div class="topImgDiv">
                                <img id="previewThumbnail" src="thumbs/01.gif" alt="小圖預覽">
                            </div>
                        </div>
                        <div class="contentImgDiv" hidden>
                            <img src="https://i.imgur.com/zul9zzl.jpg" alt="內容圖片預覽">
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
